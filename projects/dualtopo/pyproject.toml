[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dualtopo"
version = "0.1.0"
description = "DualTopo SubsetA inference with dual latent world models"
requires-python = ">=3.11"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0",
  "transformers==4.57.3", "numpy==2.1.3",
  "opencv-python-headless==4.12.0.88", "Pillow==10.4.0", "shapely==2.1.2",
  "pyquaternion==0.9.9", "tqdm==4.67.1", "huggingface-hub==0.36.2"
]

[tool.setuptools.packages.find]
include = ["dualtopo*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]
