[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dualtopo"
version = "0.1.0"
description = "DualTopo SubsetA inference with dual latent world models"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<2.11", "torchvision>=0.21,<0.26",
  "transformers==4.57.3", "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5", "shapely>=2,<3",
  "pyquaternion==0.9.9", "tqdm>=4.66", "huggingface-hub>=0.34,<1"
]

[tool.setuptools.packages.find]
include = ["dualtopo*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]
